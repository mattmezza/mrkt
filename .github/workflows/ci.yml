name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci && npm run build
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: make build
      - run: docker build --build-arg MRKT_VERSION=0.1.0-ci --build-arg MRKT_COMMIT="$GITHUB_SHA" -t mrkt:ci .
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start real S3 and SMTP capture services
        run: docker compose -f compose.yaml -f compose.dev.yaml up -d minio minio-init mailpit
      - name: Real adapters and end-to-end lifecycle
        run: |
          go test -tags=integration ./internal/artifact ./internal/mail
          node scripts/acceptance.mjs
      - name: Real Litestream restore drill
        run: go test -tags=integration ./deploy -run TestLitestreamRestoreFromRealObjectStore -v
      - if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v --remove-orphans
