name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci && npm run build
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build
      - run: docker build -t mrkt:ci .
